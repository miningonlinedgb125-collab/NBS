<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NBS Mining Bot & Jetton Protocol</title>
    <meta name="description" content="Production-ready TON Blockchain Mining Telegram Bot & NBS Jetton token ecosystem with TON Connect wallet activation, daily mining cycles, tasks, referrals, subscriptions, and full admin dashboard." />
    <meta property="og:title" content="NBS Mining Bot & Jetton Protocol" />
    <meta property="og:description" content="Production-ready TON Blockchain Mining Telegram Bot & NBS Jetton token ecosystem with TON Connect wallet activation, daily mining cycles, tasks, referrals, subscriptions, and full admin dashboard." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="root">
      <div style="position:fixed;inset:0;background:#040813;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:24px;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;user-select:none;z-index:9999;">
        <div style="padding-top:24px;">
          <div style="display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:9999px;background:rgba(15,23,42,0.8);border:1px solid rgba(16,185,129,0.3);font-size:11px;font-weight:bold;color:#34d399;letter-spacing:1px;text-transform:uppercase;">
            <span style="width:8px;height:8px;border-radius:9999px;background:#34d399;display:inline-block;"></span>
            TON Mainnet • NBS Protocol
          </div>
        </div>

        <div style="display:flex;flex-direction:column;align-items:center;text-align:center;margin:auto 0;gap:18px;">
          <div style="position:relative;width:128px;height:128px;border-radius:9999px;overflow:hidden;border:2px solid rgba(52,211,153,0.8);box-shadow:0 0 35px rgba(16,185,129,0.4);background:#000;">
            <img src="./nbs-logo.jpg" alt="NBS" style="width:100%;height:100%;object-fit:cover;" onerror="this.style.display='none'" />
          </div>
          <div>
            <h1 style="font-size:42px;font-weight:900;letter-spacing:2px;margin:0;color:#fff;text-shadow:0 0 20px rgba(52,211,153,0.4);">NBS</h1>
            <p style="font-size:12px;font-weight:600;color:#cbd5e1;margin:6px 0 0 0;letter-spacing:0.5px;">Decentralized TON Cloud Mining Protocol</p>
          </div>
        </div>

        <div style="width:100%;max-width:360px;display:flex;flex-direction:column;gap:10px;padding-bottom:32px;">
          <div style="display:flex;justify-content:space-between;font-size:12px;color:#94a3b8;font-weight:600;">
            <span>Connecting to TON Protocol...</span>
            <span style="color:#34d399;font-family:monospace;font-weight:bold;">Loading...</span>
          </div>
          <div style="width:100%;height:10px;border-radius:9999px;background:rgba(15,23,42,0.9);border:1px solid rgba(16,185,129,0.3);padding:2px;overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,0.6);">
            <div style="width:40%;height:100%;border-radius:9999px;background:linear-gradient(90deg,#10b981,#34d399,#5eead4);box-shadow:0 0 12px rgba(16,185,129,0.8);"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
